# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One free Web Service runs BOTH the FastAPI API and the Celery worker via
# honcho (see Procfile). This keeps the whole backend on Render's free tier.
# Render's dedicated "Background Worker" service type is not free; if you want
# the worker isolated, see deployment_guide.md → "Option B".
#
# Secrets (sync: false) are entered once in the Render dashboard or via
# `render env`. SECRET_KEY is generated by Render.

services:
  - type: web
    name: wallet-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: honcho start
    healthCheckPath: /openapi.json
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
