# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One free Web Service builds the root Dockerfile and runs start.sh, which
# starts the FastAPI API and the Celery worker (solo pool) in the same
# container. Render's dedicated "Background Worker" service type is not free.
#
# Secrets (sync: false) are entered once in the Render dashboard.
# SECRET_KEY is generated by Render on first deploy.

services:
  - type: web
    name: wallet-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /openapi.json
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FRONTEND_ORIGIN_REGEX
        sync: false
