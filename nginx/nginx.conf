events {}

http {
    server {
        listen 80;
        server_name _;

        # Resolve upstream service names via Docker's embedded DNS at request
        # time. Without this, nginx resolves names once at startup and keeps
        # hitting a stale container IP after `api`/`frontend` are rebuilt,
        # producing 502s. Using a variable in proxy_pass forces re-resolution.
        resolver 127.0.0.11 valid=10s ipv6=off;

        client_max_body_size 5m;

        # ---- API: route to FastAPI, stripping the /api prefix ----
        location /api/ {
            set $api_upstream api;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$api_upstream:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Everything else: Next.js frontend ----
        location / {
            set $frontend_upstream frontend;
            proxy_pass http://$frontend_upstream:3000;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
